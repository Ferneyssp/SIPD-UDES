# SIPD - ejecución completa: PostgreSQL + Django (API + inferencia ML) + React (Nginx)
#   cp .env.example .env   (y complete SECRET_KEY, DB_PASSWORD, DEMO_PASSWORD)
#   docker compose up --build
#   Aplicación: http://localhost:5173   API: http://localhost:8000/api/
#
# No se usa un servicio de ML separado: la inferencia es liviana (modelo ya
# entrenado cargado en memoria por el backend). El reentrenamiento desde la web
# se ejecuta en un hilo en segundo plano del backend (nunca dentro de la petición);
# los modelos se guardan en el volumen ml_models para que sobrevivan a reinicios.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sipd}
      POSTGRES_USER: ${DB_USER:-sipd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: ${DB_NAME:-sipd}
      DB_USER: ${DB_USER:-sipd}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-30}
      JWT_REFRESH_TOKEN_LIFETIME: ${JWT_REFRESH_TOKEN_LIFETIME:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RISK_LOW_THRESHOLD: ${RISK_LOW_THRESHOLD:-0.30}
      RISK_MEDIUM_THRESHOLD: ${RISK_MEDIUM_THRESHOLD:-0.60}
      SECURE_COOKIES: "False"
      # Docker local se sirve por http: sin redirección HTTPS ni HSTS. En producción, detrás de HTTPS,
      # elimine estas dos líneas.
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      # Nginx (servicio frontend) es el único proxy de confianza delante del backend.
      TRUSTED_PROXY_COUNT: "1"
      # Datos demo sólo si se piden explícitamente; sin DEMO_PASSWORD se genera una contraseña aleatoria.
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ML_TRAINING_EXECUTOR: ${ML_TRAINING_EXECUTOR:-thread}
      ML_ACCEPTANCE_MIN_F1: ${ML_ACCEPTANCE_MIN_F1:-}
      ML_ACCEPTANCE_MIN_RECALL: ${ML_ACCEPTANCE_MIN_RECALL:-}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Institución de Educación Superior}
      EMAIL_HOST_USER: sipd.udes.edu@gmail.com
      EMAIL_HOST_PASSWORD: oyeiqqocnrqqzvvq
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - media_data:/app/media
      # Versiones de modelos (incluidas las reentrenadas desde la web). En el primer arranque Docker copia
      # en el volumen los modelos incluidos en la imagen.
      - ml_models:/app/backend/ml_models
    ports:
      # Sólo accesible desde el equipo: el acceso normal es a través de Nginx (puerto 5173).
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-SIPD}
        VITE_INSTITUTION_NAME: ${VITE_INSTITUTION_NAME:-Institución de Educación Superior}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  media_data:
  ml_models:
